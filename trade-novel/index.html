<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>김스낵 수출 일지</title>
<style>
/* =====================================================================
   0. 스타일
   ===================================================================== */
:root {
  --bg: #efebe3;
  --panel: #ffffff;
  --panel-2: #f7f4ee;
  --ink: #1f2328;
  --ink-2: #5d646c;
  --line: #e0dacd;
  --accent: #2f4b7c;
  --accent-ink: #ffffff;
  --player: #e7eef9;
  --sys: #f1ede4;
  --good: #2e7d4f;
  --bad: #b3412e;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 6px 20px rgba(0,0,0,.06);
  /* 게임 화면의 대사창은 테마와 상관없이 어둡게 */
  --box: rgba(14, 18, 28, .86);
  --box-ink: #f4f2ee;
  --box-ink-2: #b9bfc8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121418; --panel: #1c1f24; --panel-2: #23272d; --ink: #e8e6e1; --ink-2: #a3a9b0;
    --line: #33383e; --accent: #7fa3e0; --accent-ink: #10131a; --player: #233249; --sys: #2a2a26;
    --good: #5cbf85; --bad: #e57a66; --shadow: 0 1px 3px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  --bg: #121418; --panel: #1c1f24; --panel-2: #23272d; --ink: #e8e6e1; --ink-2: #a3a9b0;
  --line: #33383e; --accent: #7fa3e0; --accent-ink: #10131a; --player: #233249; --sys: #2a2a26;
  --good: #5cbf85; --bad: #e57a66; --shadow: 0 1px 3px rgba(0,0,0,.5);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  font-size: 15px; line-height: 1.6;
}
button { font: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .5; }
.btn {
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 8px; padding: 6px 12px; min-height: 36px;
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { padding: 3px 10px; min-height: 32px; font-size: 13px; }
.btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

header.top {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
}
header.top h1 { font-size: 16px; margin: 0 auto 0 0; letter-spacing: -.01em; }
header.top h1 small { font-weight: 400; color: var(--ink-2); font-size: 12px; margin-left: 6px; }
@media (max-width: 600px) { header.top h1 small, header.top .lbl { display: none; } header.top { padding: 8px 12px; } }

.layout {
  display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px;
  max-width: 1200px; margin: 0 auto; padding: 14px 16px 20px;
}
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); padding: 10px 12px 16px; } }

/* ---- 게임 화면 ---------------------------------------------------- */
.stage { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.scene {
  position: relative; overflow: hidden; border-radius: 16px;
  height: clamp(440px, 70vh, 680px);
  box-shadow: var(--shadow);
  background: #cfd9e3;
  isolation: isolate;
}
@media (max-width: 900px) { .scene { height: min(66dvh, 600px); min-height: 420px; border-radius: 12px; } }

/* 배경: img/bg_이름.png 가 있으면 그림, 없으면 그라데이션 */
.scene .bg { position: absolute; inset: 0; z-index: -2; transition: opacity .4s; }
.scene .bg::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 30%, transparent 40%, rgba(0,0,0,.28) 100%); }
.scene[data-bg="office"] .bg { background: url(img/bg_office.png) center/cover no-repeat, linear-gradient(180deg, #c9d6e2 0%, #e6ecf0 30%, #eef1f2 60%, #b7a38a 60%, #9f8a70 100%); }
.scene[data-bg="meeting"] .bg { background: url(img/bg_meeting.png) center/cover no-repeat, linear-gradient(180deg, #cfdcd6 0%, #e9efeb 62%, #8b9b90 62%, #76867b 100%); }
.scene[data-bg="bank"] .bg { background: url(img/bg_bank.png) center/cover no-repeat, linear-gradient(180deg, #ddd7c9 0%, #efebe2 64%, #7b776a 64%, #67645a 100%); }
.scene[data-bg="mail"] .bg { background: url(img/bg_mail.png) center/cover no-repeat, linear-gradient(160deg, #2a3d60 0%, #3f5b89 55%, #22304a 100%); }
.scene[data-bg="shady"] .bg { background: url(img/bg_shady.png) center/cover no-repeat, linear-gradient(160deg, #3a2e20 0%, #6b5431 55%, #261e16 100%); }
.scene[data-bg="phone"] .bg { background: url(img/bg_port.png) center/cover no-repeat, linear-gradient(180deg, #9cc1da 0%, #d4e5ee 56%, #5e7c8e 56%, #4a6374 100%); }
/* 화상회의·메일 느낌의 격자 */
.scene[data-bg="mail"] .bg::before, .scene[data-bg="shady"] .bg::before {
  content: ""; position: absolute; inset: 0;
  background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
  background-size: 32px 32px;
}

/* 인물: 화면 아래쪽에 크게 선다 */
.portrait {
  position: absolute; left: 50%; bottom: 0; z-index: 0;
  height: 100%; aspect-ratio: 1 / 1; transform: translateX(-50%);
  display: flex; align-items: flex-end; justify-content: center;
  pointer-events: none;
}
.portrait img { width: 100%; height: 100%; object-fit: contain; object-position: center bottom; display: block; filter: drop-shadow(0 6px 18px rgba(0,0,0,.25)); }
.portrait .shape {
  width: 46%; aspect-ratio: 1 / 1; margin-bottom: 34%;
  display: grid; place-items: center; color: #fff; font-weight: 700; font-size: clamp(48px, 10vw, 96px);
  box-shadow: 0 8px 30px rgba(0,0,0,.25);
}
.portrait .shape.circle { border-radius: 50%; }
.portrait .shape.square { border-radius: 22%; }
.portrait .shape.hex { clip-path: polygon(25% 4%, 75% 4%, 100% 50%, 75% 96%, 25% 96%, 0 50%); }
.portrait .shape.diamond { clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
.portrait .shape.pill { border-radius: 40% 12% 40% 12%; }
.portrait .shape.octa { clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%); }
.portrait.enter { animation: enter .45s ease-out; }
.portrait.hop { animation: hop .35s ease-out; }
.portrait.shake { animation: shake .4s ease-in-out; }
@keyframes enter { from { opacity: 0; transform: translateX(-50%) translateY(18px); } to { opacity: 1; transform: translateX(-50%); } }
@keyframes hop { 0%, 100% { transform: translateX(-50%); } 40% { transform: translateX(-50%) translateY(-10px); } }
@keyframes shake { 0%, 100% { transform: translateX(-50%); } 20% { transform: translateX(calc(-50% - 7px)); } 40% { transform: translateX(calc(-50% + 7px)); } 60% { transform: translateX(calc(-50% - 4px)); } 80% { transform: translateX(calc(-50% + 4px)); } }
@media (prefers-reduced-motion: reduce) { .portrait.enter, .portrait.hop, .portrait.shake { animation: none; } }

/* 위쪽 정보줄 */
.hud {
  position: absolute; top: 10px; left: 10px; right: 10px; z-index: 2;
  display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap;
}
.hud .title {
  display: flex; align-items: center; gap: 8px; min-width: 0;
  background: rgba(14,18,28,.62); color: #fff; padding: 5px 12px 5px 8px; border-radius: 99px;
  font-size: 14px; font-weight: 600; backdrop-filter: blur(4px);
}
.hud .title span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hud .tools { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.hud .tools button {
  background: rgba(14,18,28,.62); color: #fff; border: 1px solid rgba(255,255,255,.18);
  border-radius: 99px; padding: 4px 12px; font-size: 13px; min-height: 32px; backdrop-filter: blur(4px);
}
.hud .tools button:hover:not(:disabled) { background: rgba(14,18,28,.85); }
.only-mobile { display: none; }
@media (max-width: 900px) { .only-mobile { display: inline-block; } }
.badge { font-size: 11px; padding: 0 8px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; font-weight: 600; }
.badge.본편 { color: #9cc0ff; }
.badge.사고 { color: #ff9c87; }
.badge.수습 { color: #8fe0b0; }
.sheet .badge.본편, .review-list .badge.본편 { color: var(--accent); }
.sheet .badge.사고, .review-list .badge.사고 { color: var(--bad); }
.sheet .badge.수습, .review-list .badge.수습 { color: var(--good); }

/* 대사창 (자막) */
.textbox {
  position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 3; cursor: pointer;
}
.textbox .inner {
  position: relative; background: var(--box); color: var(--box-ink);
  border: 1px solid rgba(255,255,255,.12); border-radius: 14px;
  padding: 24px 20px 18px; min-height: 132px; max-height: min(46vh, 300px); overflow-y: auto;
  backdrop-filter: blur(6px); box-shadow: 0 10px 30px rgba(0,0,0,.3);
}
@media (max-width: 600px) { .textbox { left: 8px; right: 8px; bottom: 8px; } .textbox .inner { padding: 22px 14px 16px; min-height: 120px; max-height: 34dvh; } }
.nameplate {
  position: absolute; left: 18px; top: -14px; z-index: 4;
  padding: 3px 14px; border-radius: 8px; color: #fff; font-weight: 700; font-size: 15px;
  box-shadow: 0 4px 12px rgba(0,0,0,.25); max-width: calc(100% - 44px);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.nameplate small { font-weight: 400; opacity: .85; margin-left: 6px; font-size: 12px; }
.nameplate[hidden] { display: none; }
.textbox .line { font-size: 17px; line-height: 1.7; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; }
@media (max-width: 600px) { .textbox .line { font-size: 15.5px; } }
.textbox .line .act { color: var(--box-ink-2); font-style: italic; }
.textbox.narr .line { color: var(--box-ink-2); font-style: italic; }
.textbox .sub { margin-top: 8px; padding-left: 10px; border-left: 2px solid rgba(255,255,255,.25); color: var(--box-ink-2); font-size: 14px; white-space: pre-wrap; }
.textbox .more { position: absolute; right: 14px; bottom: 8px; font-size: 12px; color: var(--box-ink-2); animation: blink 1.1s infinite; }
.textbox .more[hidden] { display: none; }
.textbox .endtag { display: inline-block; margin-top: 8px; font-size: 12px; letter-spacing: .2em; color: var(--box-ink-2); }
@keyframes blink { 50% { opacity: .2; } }

/* 플레이어가 한 말, 힌트 */
.echo {
  position: absolute; right: 16px; z-index: 3; max-width: 78%;
  background: rgba(231,238,249,.95); color: #1f2a3a; border-radius: 12px 12px 4px 12px;
  padding: 6px 12px; font-size: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.18);
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.echo b { font-size: 11px; color: #5b6b82; display: block; }
.echo[hidden] { display: none; }
.toast {
  position: absolute; left: 50%; top: 56px; transform: translateX(-50%); z-index: 3;
  width: min(92%, 560px); background: rgba(255,250,235,.97); color: #4a3f22;
  border-radius: 10px; padding: 8px 12px; font-size: 14px; box-shadow: 0 6px 18px rgba(0,0,0,.2);
}
.toast[hidden] { display: none; }

/* 입력 */
.controls { display: flex; gap: 6px; flex-wrap: wrap; }
.inputrow { display: flex; gap: 6px; align-items: flex-end; }
.inputrow textarea {
  flex: 1; min-width: 0; resize: none; min-height: 46px; max-height: 140px;
  font: inherit; font-size: 16px; color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px;
}
.inputrow textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.inputrow .btn { min-height: 46px; }
.mic.on { background: var(--bad); color: #fff; border-color: var(--bad); }
.status { font-size: 12px; color: var(--ink-2); min-height: 18px; }

/* ---- 옆 현황 --------------------------------------------------------- */
aside.side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.card h3 { font-size: 13px; margin: 0 0 8px; color: var(--ink-2); font-weight: 600; letter-spacing: .02em; }
.side-close { display: none; }
@media (max-width: 900px) {
  aside.side {
    display: none; position: fixed; inset: 0; z-index: 20; overflow-y: auto;
    background: var(--bg); padding: 16px;
  }
  body.show-side aside.side { display: flex; }
  .side-close { display: block; align-self: flex-end; }
}
.stages { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.stages li { font-size: 12px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--ink-2); }
.stages li.done { color: var(--good); border-color: transparent; background: var(--panel-2); }
.stages li.now { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.stages .arr { border: 0; padding: 0; color: var(--line); }
.meter { display: grid; grid-template-columns: 70px 1fr 24px; gap: 8px; align-items: center; font-size: 13px; margin: 4px 0; }
.meter .bar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
.meter .bar i { height: 10px; border-radius: 3px; background: var(--line); }
.meter .bar i.on { background: var(--accent); }
.meter.risk .bar i.on { background: var(--bad); }
.meter .num { text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.meter .hint { grid-column: 1 / -1; font-size: 11px; color: var(--ink-2); margin-top: -4px; }
.inc-list, .gloss { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.inc-list li { padding: 3px 0; }
.inc-list .ok { color: var(--good); }
.inc-list .open { color: var(--bad); }
.gloss li { border-top: 1px dashed var(--line); padding: 4px 0; }
.gloss li:first-child { border-top: 0; }
.gloss summary { cursor: pointer; font-weight: 600; }
.gloss p { margin: 2px 0 4px; color: var(--ink-2); }
.empty { color: var(--ink-2); font-size: 13px; }

/* ---- 팝업 (전환, 해설, 대화 기록, 상황, 복기) ---------------------------- */
.overlay {
  position: fixed; inset: 0; background: rgba(10,12,16,.6); display: grid; place-items: center;
  padding: 16px; z-index: 30; overflow-y: auto;
}
.overlay[hidden] { display: none; }
.sheet {
  background: var(--panel); color: var(--ink); border-radius: 16px; width: min(640px, 100%);
  max-height: calc(100dvh - 32px); overflow-y: auto; padding: 22px 20px; box-shadow: var(--shadow);
}
.sheet .when { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin: 0 0 4px; }
.sheet .notes { color: var(--ink-2); font-size: 14px; margin: 0 0 10px; white-space: pre-wrap; }
.sheet h2 { font-size: 18px; margin: 8px 0 4px; }
.sheet h3 { font-size: 16px; margin: 0 0 6px; }
.sheet .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
.situation { white-space: pre-wrap; font-size: 14px; background: var(--panel-2); border-radius: 8px; padding: 10px 12px; margin-top: 6px; overflow-x: auto; }
.goal { color: var(--ink-2); font-size: 13px; margin-top: 8px; }
.result .outcome { font-weight: 600; }
.result .review { white-space: pre-wrap; margin: 6px 0; }
.result ul { margin: 6px 0; padding-left: 20px; }
.result .delta { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.result .delta span { font-size: 12px; border-radius: 99px; padding: 1px 8px; border: 1px solid var(--line); }
.result .delta .up { color: var(--good); }
.result .delta .down { color: var(--bad); }
.result details summary { cursor: pointer; font-size: 13px; color: var(--ink-2); }
/* 대화 기록 */
.backlog { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.msg { max-width: 92%; }
.msg .who { font-size: 12px; color: var(--ink-2); margin-bottom: 2px; }
.msg .body { padding: 8px 12px; border-radius: 10px; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; }
.msg.char .body { background: var(--panel-2); border: 1px solid var(--line); }
.msg.char .body .act { color: var(--ink-2); font-style: italic; }
.msg.char .sub, .msg.narr .sub { font-size: 13px; color: var(--ink-2); margin-top: 4px; padding-left: 12px; border-left: 2px solid var(--line); white-space: pre-wrap; }
.msg.player { align-self: flex-end; }
.msg.player .who { text-align: right; }
.msg.player .body { background: var(--player); }
.msg.narr .body { color: var(--ink-2); font-style: italic; padding: 2px 4px; }
.msg.hint .body { background: var(--sys); font-size: 13px; color: var(--ink-2); }
.endmark { align-self: center; font-size: 12px; color: var(--ink-2); letter-spacing: .2em; }
/* 복기 */
.review-list { list-style: none; padding: 0; margin: 10px 0; }
.review-list > li { border-left: 3px solid var(--line); padding: 6px 0 10px 12px; margin-left: 4px; }
.review-list > li.사고 { border-left-color: var(--bad); }
.review-list > li.수습 { border-left-color: var(--good); }
.review-list > li.본편 { border-left-color: var(--accent); }
.review-list .rt { font-weight: 600; }
.review-list .ro { font-size: 13px; margin-top: 2px; }
.review-list .rs { font-size: 13px; color: var(--ink-2); }
.review-list .link { font-size: 13px; color: var(--bad); margin-top: 2px; }
.review-list .link.from { color: var(--ink-2); }
.avoided li { font-size: 13px; margin: 3px 0; }
.final-meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin: 10px 0; }
.final-meters div { background: var(--panel-2); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
.final-meters b { font-size: 20px; display: block; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<header class="top">
  <h1>김스낵 수출 일지 <small>무역 실무 학습용 비주얼 노벨 · 회사·금액·환율은 모두 가상</small></h1>
  <button class="btn small" id="btnTts" aria-pressed="false" title="캐릭터 대사를 소리로 읽어줍니다">🔈 읽어주기</button>
  <button class="btn small" id="btnTheme" title="밝기 전환" aria-label="밝기 전환">◐</button>
  <button class="btn small" id="btnReset" aria-label="처음부터 다시">↺<span class="lbl"> 처음부터 다시</span></button>
</header>

<main class="layout">
  <section class="stage" aria-label="게임 화면">
    <div class="scene" id="scene" data-bg="office">
      <div class="bg" aria-hidden="true"></div>
      <!-- 인물 영역: img/캐릭터id_표정.png -->
      <div class="portrait" id="portrait"></div>
      <div class="hud">
        <div class="title"><span class="badge 본편" id="sceneType">본편</span><span id="sceneTitle">-</span></div>
        <div class="tools">
          <button id="btnSituation">상황</button>
          <button id="btnLog">대화 기록</button>
          <button id="btnSide" class="only-mobile">현황</button>
        </div>
      </div>
      <div class="toast" id="toast" hidden></div>
      <div class="echo" id="echo" hidden></div>
      <div class="textbox" id="textbox" title="누르면 대사가 한 번에 나옵니다">
        <div class="nameplate" id="nameplate" hidden></div>
        <div class="inner" id="textInner" aria-live="polite">
          <div class="line" id="line"></div>
          <div class="sub" id="lineSub" hidden></div>
          <div class="more" id="more" hidden>▼</div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="btn small" id="btnHint">💡 힌트</button>
      <button class="btn small" id="btnPause" title="글자 출력과 음성을 멈춥니다">⏸ 멈춤</button>
      <button class="btn small" id="btnWrap" title="지금까지의 대화로 장면을 끝냅니다">이 장면 마무리</button>
    </div>
    <form class="inputrow" id="inputForm">
      <label class="sr" for="input">대사 입력</label>
      <textarea id="input" rows="1" placeholder="하고 싶은 말이나 행동을 써보세요"></textarea>

  normal: '평소', question: '되묻기', angry: '화남', approve: '인정', sigh: '한숨',
  serious: '진지', thinking: '생각 중', smile: '미소', negotiate: '흥정', concerned: '걱정', happy: '기쁨',
  urgent: '재촉', cold: '차가움', check: '심사 중', firm: '단호', explain: '설명', trouble: '곤란',

// ---- 진행 단계 -----------------------------------------------------
const STAGES = ['문의', '견적', '결제협상', '규제확인', '선적예약', '서류작성', '운송중', '도착', '대금회수', '종료'];
// 본편 장면이 없는 단계를 지나갈 때 보여줄 문구
const STAGE_PASS = {

// ---- 대사 도우미 ---------------------------------------------------
// L(표정, 대사, {sub: 번역, who: 다른 화자})
const L = (face, text, extra = {}) => ({ face, text, ...extra });
// 장면 안 체크 항목 개수
const cnt = (ss, keys) => keys.filter(k => ss.c[k]).length;

// 키워드 묶음 (문자열은 공백·쉼표를 지우고 소문자로 비교, 정규식은 원문 소문자에 적용)
const YES = ['네', '예', '좋아', '좋습', '그래', '그럽시다', '오케이', 'ok', 'okay', 'yes', 'sure', '알겠', '진행', '그렇게', '수락', 'accept', 'agree', '동의', '할게', '하겠', '하죠', '부탁', 'deal', 'confirm'];
const NEG = ['안 해', '안 할', '안 돼', '안 되', '안 보', '안 내', '안 냅', '않', '못', '말고', '생략', '필요 없', '건너', '거절', '싫', '아니', '아뇨', '어렵', '곤란', '힘들', '불가',
  /\bno\b/, /\bnot\b/, /n't\b/, /\bcannot\b/];
const ASK_PREV = ['재발', '앞으로', '다음부터', '다음엔', '다음에는', '방지', '체크리스트', '원칙', '규칙', '매뉴얼', '프로세스', '절차'];

// ---- 수습 장면 공장 ------------------------------------------------
// 수습 장면은 모두 같은 흐름(지금 할 일 → 재발 방지)이라 틀을 하나로 만든다.
function recovery(o) {
  const stepKeys = o.steps.map(s => 's_' + s.key);
  const nSteps = ss => cnt(ss, stepKeys);
  const follow = ss => {
    if (ss.c.prev) return { tail: '\n좋아요. 오늘 정한 순서대로 바로 움직입시다. 수고했어요.', end: true, face: 'smile' };
    if (nSteps(ss) >= 2) return { tail: '\n(고개를 끄덕이며) 수습 순서는 이 정도면 됐어요. 마지막으로 하나만요. 같은 일이 다시 안 생기게 하려면, 우리 일하는 방식에서 무엇을 바꿔야 할까요?', ask: 'prev' };
    return { tail: '\n' + (ss.turns % 2 ? '좋아요. 그다음은요?' : '그렇죠. 또 지금 바로 해야 할 게 있을까요?') };
  };
  const prevSay = ss => nSteps(ss) >= 1
    ? L('smile', o.prevention.reply + '\n좋아요. 오늘 정한 순서대로 바로 움직입시다. 수고했어요.', { end: true })
    : L('normal', o.prevention.reply + '\n좋은 생각이에요. 그런데 그 전에, 지금 당장 해야 할 것부터 정해요. 뭐부터 할까요?');
  // 재발 방지를 물은 직후의 답은 수습 단계보다 먼저 재발 방지로 읽는다
  const rules = [{ id: 'prevp', pending: 'prev', m: [...o.prevention.kw, ...ASK_PREV, '확인', '먼저', '전에', '후에', '반드시', '꼭'], set: { prev: true }, say: prevSay }];
  for (const s of o.steps) {
    rules.push({
      id: 'step_' + s.key, m: s.kw, not: s.not, set: { ['s_' + s.key]: true },
      say: ss => { const f = follow(ss); return L(f.face || s.face || 'normal', s.reply + f.tail, { end: f.end, ask: f.ask }); },
    });
  }
  rules.push({
    id: 'prev', m: [...o.prevention.kw, ...ASK_PREV], set: { prev: true }, say: prevSay,
  });
  rules.push({ id: 'sorry', once: false, m: ['죄송', '잘못', '제 탓', '미안', '실수', 'sorry'],
    say: L('smile', '(손을 가볍게 저으며) 사과는 나중에 해도 돼요. 지금은 할 수 있는 것부터 봅시다. 뭐부터 할까요?') });
  rules.push({ id: 'dunno', once: false, m: ['모르', '막막', '어떻게', '뭐부터', '글쎄'],
    say: L('thinking', o.nudge) });

  return {
    id: o.id, title: o.title, type: '수습', character: 'moon', priority: 100, resolves: o.resolves,
    when: st => st.incidents.some(i => i.id === o.resolves && !i.resolved),
    transition: o.transition || '그날 오후, 작은 회의실',
    situation: o.situation,
    opening: L('normal', o.opening),
    facts: o.facts, hidden: '없음',
    goal: o.goal || '사고 수습 순서를 직접 정하고, 재발 방지책을 말한다.',
    hints: o.hints,
    rules,
    fallback: [L('thinking', o.nudge), L('normal', '조금 더 구체적으로요. 누구에게, 무엇을, 언제까지 할지요.')],
    timeout: L('normal', '시간이 됐네요. 오늘 나온 것부터 바로 실행합시다. 재발 방지책은 다음 주까지 정리해서 주세요.'),
    outcomes: [
      { key: 'solid', description: '수습 단계를 둘 이상 스스로 정하고 재발 방지책까지 말했다',
        test: ss => nSteps(ss) >= 2 && ss.c.prev, resolveIncident: true, meterDelta: { 팀신뢰: +1 },
        learned: o.learned, review: o.review },
      { key: 'partial', description: '수습 방향은 잡았지만 빠진 단계나 재발 방지책이 있다',
        test: ss => nSteps(ss) >= 1, resolveIncident: true, meterDelta: {},
        learned: o.learned, review: o.review + '\n이번엔 일부만 스스로 정했다. 빠진 순서: ' + o.steps.map(s => s.label).join(', ') + ' 중 말하지 않은 것들.' },
      { key: 'weak', description: '수습안을 거의 내지 못했다', neutral: true,
        resolveIncident: true, meterDelta: { 팀신뢰: -1 },
        learned: o.learned, review: o.review + '\n이번엔 팀장이 정리했다. 다음엔 "지금 화물·돈이 어디 있고 누구에게 먼저 연락할지"부터 말해보자.' },
    ],
  };
}

  if (played('i_unpaid')) {
    const o = hist('i_unpaid') && hist('i_unpaid').outcome;
    if (o === 'partial') add('클레임 20카톤 공제', Math.round(price * 20));
    else if (o === 'spoof') add('사칭 계좌 송금분 분쟁 (회수 중, 30% 손실 처리)', Math.round(price * 700 * 0.3));

  const actual = Math.round(revenueUsd * rate - COST_KRW_PER_CTN * QTY - logisticsUsd * QUOTE_RATE - extraUsd * QUOTE_RATE);
  return { price: price * (discount ? 0.98 : 1), freight, rate, fxBuffer, discount, extras, expected, actual };

<script>
/* =====================================================================

const SAVE_KEY = 'kimsnack-trade-novel-v1';
const METER_KEYS = ['마진', '위험도', '바이어신뢰', '팀신뢰'];
const METER_INFO = {
  마진: '높을수록 좋음', 위험도: '낮을수록 좋음', 바이어신뢰: '바이어가 우리를 믿는 정도', 팀신뢰: '팀이 나를 믿는 정도',
};

function newState() {
  return {
    stage: '문의',
    flags: {
      quoteHasValidity: null, insuranceIncluded: null, paymentTerm: null,
      buyerVerified: null, docsCrossChecked: null, surrenderedBeforePayment: null,
      scheduleConfirmed: null, lcWordingChecked: null, labelChecked: null,
      fxBuffer: null, freightDeal: null,
    },
    meters: { 마진: 3, 위험도: 2, 바이어신뢰: 3, 팀신뢰: 3 },
    incidents: [],   // {id, title, sceneId, resolved}
    learned: [],     // {term, desc}
    history: [],     // 지나온 장면과 결과
    played: [],      // 한 번 나온 장면 id
    notes: [],       // 다음 전환 화면에 보여줄 단계 이동 문구
  };
}

const val = (v, ...args) => (typeof v === 'function' ? v(...args) : v);
const sceneById = id => SCENES.find(s => s.id === id);
function safeWhen(s, st) {
  try { return !!s.when(st); } catch (e) { console.warn('when 오류', s.id, e); return false; }
}
function advanceStage(st) {
  const i = STAGES.indexOf(st.stage);
  st.stage = STAGES[Math.min(i + 1, STAGES.length - 1)];
  if (STAGE_PASS[st.stage]) st.notes.push(STAGE_PASS[st.stage]);
}

// 다음 장면 고르기 (규칙 1~4)
function pickNext(st) {
  for (let guard = 0; guard < 40; guard++) {
    if (st.stage === '종료') return null;
    // 1. 미해결 사고가 있으면 수습 장면
    const open = st.incidents.find(i => !i.resolved);
    if (open) {
      const r = SCENES.find(s => s.type === '수습' && s.resolves === open.id && !st.played.includes(s.id));
      if (r) return r;
      open.resolved = true; // 짝이 되는 수습 장면이 없으면 자동 해결
      continue;
    }
    // 2. 조건이 맞는 사고 장면 중 priority 높은 것
    const byPri = (a, b) => (b.priority || 0) - (a.priority || 0);
    const inc = SCENES.filter(s => s.type === '사고' && !st.played.includes(s.id) && safeWhen(s, st)).sort(byPri)[0];
    if (inc) return inc;
    // 3. 현재 단계의 본편
    const main = SCENES.filter(s => s.type === '본편' && !st.played.includes(s.id) && safeWhen(s, st)).sort(byPri)[0];
    if (main) return main;
    // 본편이 없는 단계(운송중, 도착)는 다음 단계로 넘긴다
    advanceStage(st);
  }
  return null;
}

function resolveObj(obj, ss, st) {
  const out = {};
  for (const [k, v] of Object.entries(obj || {})) out[k] = val(v, ss, st);
  return out;
}

// 판정: 위에서부터 test가 참인 첫 결말
function judge(sc, ss, st) {
  return sc.outcomes.find(o => !o.test || o.test(ss, st))
    || sc.outcomes.find(o => o.neutral)
    || sc.outcomes[sc.outcomes.length - 1];
}

// 결말을 상태값에 반영
function applyOutcome(sc, ss, st, o) {
  const flags = { ...(sc.flagsFrom ? sc.flagsFrom(ss, st) : {}), ...resolveObj(o.setFlags, ss, st) };
  for (const k of Object.keys(flags)) if (flags[k] === null) delete flags[k];
  Object.assign(st.flags, flags);

  const md = typeof o.meterDelta === 'function' ? o.meterDelta(ss, st) : resolveObj(o.meterDelta, ss, st);
  const deltas = {};
  for (const k of METER_KEYS) {
    const d = md[k] || 0;
    if (!d) continue;
    const before = st.meters[k];
    st.meters[k] = Math.max(0, Math.min(5, before + d));
    if (st.meters[k] !== before) deltas[k] = st.meters[k] - before;
  }

  let added = null;
  if (o.addIncident) {
    const inc = val(o.addIncident, ss, st);
    added = { ...inc, sceneId: sc.id, resolved: false };
    st.incidents.push(added);
  }
  let resolved = null;
  if (o.resolveIncident && sc.resolves) {
    st.incidents.forEach(i => { if (i.id === sc.resolves && !i.resolved) { i.resolved = true; resolved = i.title; } });
  }

  const learned = val(o.learned, ss, st) || [];
  const fresh = learned.filter(l => !st.learned.some(x => x.term === l.term));
  st.learned.push(...fresh);

  // 이 장면을 부른 앞 장면
  let causedBy = null;
  if (sc.type === '사고' && sc.cause && sc.cause.length) {
    for (let i = st.history.length - 1; i >= 0; i--) {
      if (Object.keys(st.history[i].flags || {}).some(k => sc.cause.includes(k))) { causedBy = i; break; }
    }
  }
  if (sc.type === '수습') {
    const i = st.history.findIndex(h => h.addedIncident === sc.resolves);
    if (i >= 0) causedBy = i;
  }

  const summary = val(o.summary, ss, st) || o.description;
  const review = val(o.review, ss, st) || '';
  st.history.push({
    sceneId: sc.id, title: sc.title, type: sc.type, stage: st.stage,
    outcome: o.key, outcomeDesc: o.description, summary, review,
    flags, addedIncident: added ? added.id : null, causedBy, ss: { ...ss.c },
  });
  st.played.push(sc.id);
  if (sc.type === '본편') advanceStage(st);

  return {
    outcome: o.description, summary, review, deltas,
    learned: fresh.map(l => l.term),
    incident: added ? added.title : null, resolved,
    facts: val(sc.facts, st) || [], hidden: sc.type === '사고' ? val(sc.hidden, st) : null,
  };
}

/* =====================================================================
   3. 대사 엔진 — AI 호출 대신 규칙으로 "배우"와 "판정"을 맡는다
   ---------------------------------------------------------------------
   respond(scene, ss, state, 입력) → { reply, end }
   나중에 AI로 바꾸고 싶으면 이 함수만 바꿔 끼우면 된다.
   ===================================================================== */
function norm(s) { return String(s).toLowerCase().replace(/[\s,!?~"'“”‘’]/g, ''); }
function hit(kw, n, raw) {
  if (kw instanceof RegExp) return kw.test(raw);
  const k = norm(kw);
  return !!k && n.includes(k);
}
const anyHit = (list, n, raw) => (list || []).some(k => hit(k, n, raw));
function ruleMatches(r, n, raw) {
  if (!r.m && !r.all) return false;
  if (r.m && !anyHit(r.m, n, raw)) return false;
  if (r.all && !r.all.every(g => anyHit(g, n, raw))) return false;
  if (r.not && anyHit(r.not, n, raw)) return false;
  return true;
}
function newSS(sc) { return { c: {}, used: {}, turns: 0, pending: sc.openAsk || null, fb: 0, hint: 0 }; }

function respond(sc, ss, st, input) {
  const raw = String(input).toLowerCase();
  const n = norm(input);
  for (const r of sc.rules) {
    if (r.pending && ss.pending !== r.pending) continue;
    if (r.once !== false && ss.used[r.id]) continue;
    if (r.need && !r.need(ss, st)) continue;
    if (!ruleMatches(r, n, raw)) continue;
    ss.used[r.id] = true;
    if (r.set) Object.assign(ss.c, r.set);
    const got = val(r.say, ss, st);
    const reply = got ? { ...got } : null;
    const ask = reply && reply.ask !== undefined ? reply.ask : r.ask;
    ss.pending = ask || null;
    return { reply, end: !!(r.end || (reply && reply.end)), rule: r.id };
  }
  const list = sc.fallback && sc.fallback.length ? sc.fallback : [L('normal', '…무슨 말인지 다시 해볼래?')];
  const fb = list[ss.fb % list.length];
  ss.fb++;
  return { reply: { ...fb }, end: false, rule: null };
}

const Voice = {
  ttsOn: false,
  voices: [],
  init() {
    if (!('speechSynthesis' in window)) return;
    const load = () => { this.voices = speechSynthesis.getVoices(); };
    load();
    speechSynthesis.addEventListener?.('voiceschanged', load);
  },
  pick(lang) {
    const base = lang.split('-')[0];
    return this.voices.find(v => v.lang === lang) || this.voices.find(v => v.lang && v.lang.startsWith(base)) || null;
  },
  // 캐릭터 대사 읽기: (괄호) 안 행동 묘사와 따옴표는 읽지 않는다
  speak(text, charId) {
    if (!this.ttsOn || !('speechSynthesis' in window) || !text) return;
    const ch = CHARACTERS[charId] || CHARACTERS.narr;
    const clean = text.replace(/\([^)]*\)/g, ' ').replace(/["“”]/g, '').replace(/\s+/g, ' ').trim();
    if (!clean) return;
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = ch.voice.lang;
    u.pitch = ch.voice.pitch;
    u.rate = ch.voice.rate;
    const v = this.pick(ch.voice.lang);
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  },
  stop() { if ('speechSynthesis' in window) speechSynthesis.cancel(); },

  // 말로 입력 (크롬·엣지·사파리. https 또는 localhost에서만 마이크가 켜진다)
  rec: null, listening: false,
  canListen() { return !!(window.SpeechRecognition || window.webkitSpeechRecognition); },
  listen(onText, onState, onError) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { onError('이 브라우저는 음성 입력을 지원하지 않아요. 크롬이나 엣지에서 열어주세요.'); return; }
    if (this.listening) { this.rec && this.rec.stop(); return; }
    const rec = new SR();
    rec.lang = 'ko-KR';
    rec.interimResults = true;
    rec.continuous = false;
    rec.onresult = e => {
      let t = '';
      for (const r of e.results) t += r[0].transcript;
      onText(t);
    };
    rec.onerror = e => {
      const msg = e.error === 'not-allowed' || e.error === 'service-not-allowed'
        ? '마이크 권한이 없어요. 주소가 https:// 또는 localhost인지, 브라우저 마이크 권한을 확인해주세요.'
        : e.error === 'no-speech' ? '말소리가 들리지 않았어요. 다시 눌러 말해보세요.' : '음성 입력 오류: ' + e.error;
      onError(msg);
    };
    rec.onend = () => { this.listening = false; onState(false); };
    this.rec = rec;
    this.listening = true;
    onState(true);
    try { rec.start(); } catch (e) { this.listening = false; onState(false); onError('음성 입력을 시작하지 못했어요.'); }
  },
};

// ---- 인물 (img/캐릭터_표정.png → img/캐릭터_normal.png → 도형) -----------
const srcCache = new Map(); // "han_angry" → 실제로 열린 경로 또는 null
function resolveSrc(ch, face) {
  const key = ch.img + '_' + face;
  if (srcCache.has(key)) return Promise.resolve(srcCache.get(key));
  const list = [...new Set([`img/${ch.img}_${face}.png`, `img/${ch.img}_normal.png`])];
  return new Promise(resolve => {
    let i = 0;
    const img = new Image();
    img.onload = () => { srcCache.set(key, list[i]); resolve(list[i]); };
    img.onerror = () => { i++; if (i < list.length) img.src = list[i]; else { srcCache.set(key, null); resolve(null); } };
    img.src = list[0];
  });
}

  const el = $('portrait');

  face = face || 'normal';
  const token = ++portraitToken;
  const src = await resolveSrc(ch, face);
  if (token !== portraitToken) return;
  const changed = shown.charId !== charId;
  const faceChanged = shown.face !== face;
  if (el.dataset.src !== (src || 'shape:' + charId)) {
    el.dataset.src = src || 'shape:' + charId;

  if (anim) { el.classList.remove('enter', 'hop', 'shake'); void el.offsetWidth; el.classList.add(anim); }

  $('more').hidden = true;
}

// 캐릭터가 말한다
function speak(reply) {
  const who = reply.who || G.cur.charId;
  const t = who === 'narr' ? 'narr' : 'char';
  if (t === 'char') renderPortrait(who, reply.face);
  Voice.speak(t === 'narr' ? '' : reply.text, who);
  return addLog({ t, who, face: reply.face || 'normal', text: reply.text, sub: reply.sub || null }, true);
}

function setStatus(html) { $('status').innerHTML = html || ''; }
function setInputEnabled(on) {
  for (const id of ['input', 'btnSend', 'btnHint', 'btnWrap', 'btnMic']) $(id).disabled = !on;
  if (on && !Voice.canListen()) $('btnMic').disabled = true;
}

function renderHead() {
  const sc = sceneById(G.cur.sceneId);
  $('sceneType').className = 'badge ' + sc.type;
  $('sceneType').textContent = sc.type;
  $('sceneTitle').textContent = sc.title;
  setBackground();
}

// ---- 팝업 ------------------------------------------------------------
function openSheet(html, focusSel) {
  $('sheet').innerHTML = html;
  $('overlay').hidden = false;
  const f = focusSel && $('sheet').querySelector(focusSel);
  (f || $('sheet')).focus && (f || $('sheet')).focus();
}
function closeSheet() { $('overlay').hidden = true; }

function resultHTML(r) {
  const deltas = Object.entries(r.deltas || {}).map(([k, d]) => {
    const good = k === '위험도' ? d < 0 : d > 0;
    return `<span class="${good ? 'up' : 'down'}">${k} ${d > 0 ? '+' : ''}${d}</span>`;
  }).join('');
  return `<div class="result">
    <p class="when">해설</p>
    <div class="outcome">결말: ${esc(r.outcome)}</div>
    <div class="review">${esc(r.review)}</div>
    ${r.incident ? `<div class="delta"><span class="down">사고 발생: ${esc(r.incident)}</span></div>` : ''}
    ${r.resolved ? `<div class="delta"><span class="up">수습 완료: ${esc(r.resolved)}</span></div>` : ''}
    ${deltas ? `<div class="delta">${deltas}</div>` : ''}
    ${r.learned && r.learned.length ? `<div>📘 용어집에 추가: ${r.learned.map(esc).join(', ')}</div>` : ''}
    ${r.hidden && r.hidden !== '없음' ? `<details><summary>숨어 있던 사실</summary><p>${esc(r.hidden)}</p></details>` : ''}
    <details><summary>이 장면의 무역 사실</summary><ul>${(r.facts || []).map(f => `<li>${esc(f)}</li>`).join('')}</ul></details>
    <div class="actions">
      <button class="btn" data-act="log">대화 기록</button>
      <button class="btn primary" data-act="next">다음 장면 →</button>
    </div></div>`;
}
function showResult(r) { openSheet(resultHTML(r), '[data-act="next"]'); }

function showBacklog() {
  if (!G.cur || !G.cur.log) return;
  openSheet(`<h3>대화 기록</h3><div class="backlog" id="backlog"></div>
    <div class="actions">${G.cur.phase === 'result' ? '<button class="btn" data-act="result">해설로 돌아가기</button>' : ''}<button class="btn primary" data-act="close">닫기</button></div>`, '[data-act="close"]');
  const box = $('backlog');
  for (const line of G.cur.log) if (line.t !== 'result') box.appendChild(lineNode(line));
  if (!G.cur.log.length) box.innerHTML = '<p class="empty">아직 대화가 없어요.</p>';
  requestAnimationFrame(() => { $('sheet').scrollTop = $('sheet').scrollHeight; });
}
function showSituation() {
  if (!G.cur || !G.cur.sceneId) return;
  const sc = sceneById(G.cur.sceneId);
  openSheet(`<span class="badge ${sc.type}">${sc.type}</span><h2>${esc(sc.title)}</h2>
    <div class="situation">${esc(G.cur.situation)}</div>
    <p class="goal">학습 목표 · ${esc(sc.goal)}</p>
    <div class="actions"><button class="btn primary" data-act="close">닫기</button></div>`, '[data-act="close"]');
}

// ---- 흐름 -------------------------------------------------------------
function goNext() {
  Voice.stop();
  closeSheet();
  const sc = pickNext(G.st);
  if (!sc) { G.cur = { phase: 'review', log: [] }; save(); renderSide(); showReview(); return; }
  const notes = G.st.notes.splice(0);
  G.cur = {
    sceneId: sc.id, charId: val(sc.character, G.st), situation: val(sc.situation, G.st),
    transition: val(sc.transition, G.st) || '', ss: newSS(sc), log: [], phase: 'transition', notes,
  };
  save();
  renderSide();
  showTransition();
}

function showTransition() {
  const sc = sceneById(G.cur.sceneId);
  const ch = CHARACTERS[G.cur.charId];
  renderHead();
  shown = { charId: null, face: null };
  $('portrait').innerHTML = '';
  $('portrait').dataset.src = '';
  $('line').textContent = '';
  setNameplate(null);
  showEcho('');
  setInputEnabled(false);
  openSheet(`
    <p class="when">${esc(G.cur.transition)}</p>
    ${G.cur.notes.length ? `<p class="notes">${G.cur.notes.map(esc).join('\n')}</p>` : ''}
    <span class="badge ${sc.type}">${sc.type}</span>
    <h2>${esc(sc.title)}</h2>
    <p class="notes">등장: ${esc(ch.name)} · ${esc(ch.role)}</p>
    <div class="situation">${esc(G.cur.situation)}</div>
    <p class="goal">학습 목표 · ${esc(sc.goal)}</p>
    <div class="actions"><button class="btn primary" data-act="start">시작</button></div>`, '[data-act="start"]');
}

async function beginScene() {
  closeSheet();
  const sc = sceneById(G.cur.sceneId);
  G.cur.phase = 'play';
  renderHead();
  setInputEnabled(true);
  save();
  await speak(val(sc.opening, G.st));
  save();
  $('input').focus({ preventScroll: true });
}

async function onSend() {
  if (!G.cur || G.cur.phase !== 'play') return;
  const input = $('input');
  const text = input.value.trim();
  if (!text) return;
  skipTyping();
  input.value = '';
  autoGrow();
  setStatus('');
  const sc = sceneById(G.cur.sceneId);
  const ss = G.cur.ss;
  addLog({ t: 'player', text });
  let res;
  try {
    res = respond(sc, ss, G.st, text);
  } catch (e) {
    console.error(e);
    G.cur.log.pop();
    showEcho('');
    input.value = text;
    setStatus('응답을 만드는 중 문제가 생겼어요. <button class="btn small" data-act="resend">다시 보내기</button>');
    return;
  }
  ss.turns++;
  setInputEnabled(false);
  if (res.reply) await speak(res.reply);
  let end = res.end;
  if (!end && ss.turns >= (sc.maxTurns || 9)) {
    await speak(sc.timeout);
    Object.assign(ss.c, sc.timeoutSet || {});
    end = true;
  }
  save();
  if (end) await endScene();
  else { setInputEnabled(true); input.focus({ preventScroll: true }); }
}

async function wrapScene() {
  if (!G.cur || G.cur.phase !== 'play') return;
  skipTyping();
  const sc = sceneById(G.cur.sceneId);
  setInputEnabled(false);
  await speak(sc.timeout);
  Object.assign(G.cur.ss.c, sc.timeoutSet || {});
  await endScene();
}

async function endScene() {
  const sc = sceneById(G.cur.sceneId);
  const ss = G.cur.ss;
  if (sc.endSay) { const l = sc.endSay(ss, G.st); if (l) await speak(l); }
  addLog({ t: 'end' });
  const o = judge(sc, ss, G.st);
  const r = applyOutcome(sc, ss, G.st, o);
  G.cur.phase = 'result';
  setInputEnabled(false);
  renderSide();
  // 마지막 대사를 잠깐 보여준 뒤 해설을 띄운다
  await new Promise(res => setTimeout(res, FAST ? 0 : 900));
  addLog({ t: 'result', ...r });
  save();
}

function showHint() {
  if (!G.cur || G.cur.phase !== 'play') return;
  const sc = sceneById(G.cur.sceneId);
  const hints = val(sc.hints, G.st) || [];
  if (!hints.length) return;
  addLog({ t: 'hint', text: hints[G.cur.ss.hint % hints.length] });
  G.cur.ss.hint++;
  save();
}

// ---- 복기 화면 -----------------------------------------------------------
function showReview() {
  const st = G.st;
  const h = st.history;
  const items = h.map((e, i) => {
    const calls = h.map((x, j) => (x.causedBy === i ? j : -1)).filter(j => j >= 0);
    const from = e.causedBy != null && h[e.causedBy] ? h[e.causedBy] : null;
    return `<li class="${e.type}">
      <div class="rt"><span class="badge ${e.type}">${e.type}</span> ${i + 1}. ${esc(e.title)}</div>
      <div class="ro">결말: ${esc(e.outcomeDesc)}</div>
      <div class="rs">${esc(e.summary)}</div>
      ${from ? `<div class="link from">← ${e.causedBy + 1}번 「${esc(from.title)}」의 결말에서 이어짐</div>` : ''}
      ${calls.map(j => `<div class="link">→ 이 결말이 ${j + 1}번 「${esc(h[j].title)}」 장면을 불렀다</div>`).join('')}
    </li>`;
  }).join('');
  const avoided = SCENES.filter(s => s.type === '사고' && !st.played.includes(s.id) && s.avoided && safeWhenFn(s.avoided, st));
  $('sceneType').className = 'badge 수습';
  $('sceneType').textContent = '완료';
  $('sceneTitle').textContent = '첫 수출 완료';
  $('scene').dataset.bg = 'office';
  setNameplate(null);
  $('line').textContent = '첫 수출 한 건이 끝났다. 위의 "복기" 버튼으로 다시 볼 수 있다.';
  $('more').hidden = true;
  showEcho('');
  setInputEnabled(false);
  openSheet(`
    <p class="when">복기</p>
    <p class="notes">첫 수출 한 건이 끝났다. 지나온 장면과, 각 결말이 어떤 장면을 불렀는지 따라가 보자.</p>
    <div class="final-meters">${METER_KEYS.map(k => `<div>${k}<b>${st.meters[k]} / 5</b></div>`).join('')}</div>
    <ol class="review-list">${items}</ol>
    ${avoided.length ? `<h2>피한 사고</h2><ul class="avoided">${avoided.map(s => `<li>✓ 「${esc(s.title)}」 — ${esc(s.avoidNote)}</li>`).join('')}</ul>` : ''}
    <p class="notes">사고 ${st.incidents.length}건 · 배운 용어 ${st.learned.length}개 (현황의 용어집)</p>
    <p class="notes">다시 하면서 다르게 대처하면 다른 장면이 나온다.</p>
    <div class="actions">
      <button class="btn" data-act="close">닫기</button>
      <button class="btn primary" data-act="reset">처음부터 다시</button>
    </div>`, '[data-act="reset"]');
}
function safeWhenFn(fn, st) { try { return !!fn(st); } catch (e) { return false; } }

function resetGame() {
  if (G && G.st && G.st.history.length && !confirm('지금까지의 진행을 지우고 처음부터 다시 시작할까요?')) return;
  Voice.stop();
  skipTyping();
  G = { st: newState(), cur: null };
  closeSheet();
  goNext();
}

// ---- 입력창 -----------------------------------------------------------
function autoGrow() {
  const t = $('input');
  t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight, 140) + 'px';
}

function bind() {
  $('inputForm').addEventListener('submit', e => { e.preventDefault(); onSend(); });
  $('input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); onSend(); }
  });
  $('input').addEventListener('input', autoGrow);
  $('textbox').addEventListener('click', skipTyping);
  $('btnHint').addEventListener('click', showHint);
  $('btnPause').addEventListener('click', () => { skipTyping(); Voice.stop(); });
  $('btnWrap').addEventListener('click', wrapScene);
  $('btnReset').addEventListener('click', resetGame);
  $('btnLog').addEventListener('click', () => (G.cur && G.cur.phase === 'review' ? showReview() : showBacklog()));
  $('btnSituation').addEventListener('click', () => (G.cur && G.cur.phase === 'review' ? showReview() : showSituation()));
  $('btnSide').addEventListener('click', () => document.body.classList.add('show-side'));
  $('btnSideClose').addEventListener('click', () => document.body.classList.remove('show-side'));
  window.addEventListener('resize', positionEcho);
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    document.body.classList.remove('show-side');
    if (!$('overlay').hidden && $('sheet').querySelector('[data-act="close"]')) closeSheet();
  });
  document.addEventListener('click', e => {
    const act = e.target.closest('[data-act]');
    if (!act) return;
    const a = act.dataset.act;
    if (a === 'next') goNext();
    else if (a === 'start') beginScene();
    else if (a === 'reset') resetGame();
    else if (a === 'close') closeSheet();
    else if (a === 'log') showBacklog();
    else if (a === 'result') { const r = [...G.cur.log].reverse().find(l => l.t === 'result'); if (r) showResult(r); }
    else if (a === 'resend') { setStatus(''); onSend(); }
  });

  // 읽어주기
  Voice.init();
  Voice.ttsOn = load('kimsnack-tts') === '1';
  const tts = $('btnTts');
  const syncTts = () => { tts.setAttribute('aria-pressed', String(Voice.ttsOn)); tts.innerHTML = (Voice.ttsOn ? '🔊' : '🔈') + '<span class="lbl"> 읽어주기</span>'; tts.setAttribute('aria-label', '읽어주기'); };
  if (!('speechSynthesis' in window)) { tts.disabled = true; tts.title = '이 브라우저는 읽어주기를 지원하지 않아요'; }
  syncTts();
  tts.addEventListener('click', () => { Voice.ttsOn = !Voice.ttsOn; if (!Voice.ttsOn) Voice.stop(); store('kimsnack-tts', Voice.ttsOn ? '1' : '0'); syncTts(); });

  // 말로 입력
  const mic = $('btnMic');
  if (!Voice.canListen()) mic.title = '이 브라우저는 음성 입력을 지원하지 않아요 (크롬·엣지 권장)';
  let base = '';
  mic.addEventListener('click', () => {
    if (!Voice.listening) base = $('input').value ? $('input').value.trim() + ' ' : '';
    Voice.listen(
      t => { $('input').value = base + t; autoGrow(); },
      on => { mic.classList.toggle('on', on); mic.setAttribute('aria-pressed', String(on)); setStatus(on ? '듣는 중… 말을 마치면 자동으로 멈춰요.' : ''); },
      msg => setStatus(esc(msg)),
    );
  });

  // 밝기
  const theme = load('kimsnack-theme');
  if (theme) document.documentElement.dataset.theme = theme;
  $('btnTheme').addEventListener('click', () => {
    const dark = document.documentElement.dataset.theme
      ? document.documentElement.dataset.theme === 'dark'
      : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'light' : 'dark';
    store('kimsnack-theme', document.documentElement.dataset.theme);
  });
}

// ---- 시작 -------------------------------------------------------------
function boot() {
  bind();
  let saved = null;
  try { saved = JSON.parse(load(SAVE_KEY) || 'null'); } catch (e) { saved = null; }
  if (saved && saved.st && saved.cur && (saved.cur.phase === 'review' || sceneById(saved.cur.sceneId))) {
    G = saved;
    renderSide();
    if (G.cur.phase === 'review') { showReview(); return; }
    if (G.cur.phase === 'transition') { showTransition(); return; }
    renderHead();
    restoreScreen();
    setInputEnabled(G.cur.phase === 'play');
    if (G.cur.phase === 'result') { const r = [...G.cur.log].reverse().find(l => l.t === 'result'); if (r) showResult(r); }
    return;
  }
  G = { st: newState(), cur: null };
  goNext();
}

// 테스트용 핸들
window.__game = { get G() { return G; }, SCENES, pickNext, respond, judge };
boot();
</script>
</body>
</html>
