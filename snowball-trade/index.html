<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>캡틴 스노우볼 무역회사</title>
<meta name="description" content="마이펫의 이중생활 스노우볼과 함께 제주 당근 수입 한 건을 처음부터 끝까지 진행하며 무역 실무 감각을 익히는 선택형 학습 게임 (개인 학습용 팬 게임)">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ===== 0. 스타일 ===== */
:root {
  --bg: #17201e;
  --panel: #fffdf8;
  --ink: #2b2622;
  --muted: #7a6f66;
  --line: #e6ddd0;
  --chip: #f5efe6;
  --accent: #e2574c;
  --ok: #2f9e6b;
  --warn: #d98a1e;
  --lesson: #fff4d6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --panel: #26221f; --ink: #f1ebe4; --muted: #b3a89d; --line: #3f3832;
    --chip: #322c28; --lesson: #3a3222;
  }
}
:root[data-theme="dark"] {
  --panel: #26221f; --ink: #f1ebe4; --muted: #b3a89d; --line: #3f3832;
  --chip: #322c28; --lesson: #3a3222;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  overflow: hidden; -webkit-tap-highlight-color: transparent;
}
#app { position: fixed; inset: 0; display: flex; flex-direction: column; max-width: 960px; margin: 0 auto; }

/* 상단 현황 */
.top {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 8px 12px; background: #0d1413; color: #fff; font-size: 14px;
}
.top .logo { font-weight: 800; margin-right: auto; }
.top .stat { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.rage { width: 90px; height: 10px; border-radius: 99px; background: rgba(255,255,255,.18); overflow: hidden; }
.rage i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #f7c948, #e2574c); transition: width .4s; }
.top button {
  background: rgba(255,255,255,.12); color: #fff; border: 0; border-radius: 8px;
  padding: 5px 9px; font: inherit; font-size: 13px; cursor: pointer;
}
.dots { display: flex; gap: 4px; padding: 6px 12px; background: #0d1413; border-top: 1px solid rgba(255,255,255,.06); }
.dots span { flex: 1; height: 5px; border-radius: 9px; background: rgba(255,255,255,.15); }
.dots span.done { background: #f7c948; }
.dots span.now { background: #e2574c; }

/* 무대 */
#stage { position: relative; flex: 1; display: flex; flex-direction: column; overflow: hidden; cursor: pointer; transition: background .6s; background-size: cover; background-position: center; }
#place { position: absolute; top: 10px; left: 12px; color: rgba(255,255,255,.85); font-size: 13px; background: rgba(0,0,0,.3); padding: 4px 10px; border-radius: 99px; }
#portrait { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 26px; min-height: 0; }
#portrait .face { height: clamp(150px, 34vh, 290px); aspect-ratio: 200 / 240; filter: drop-shadow(0 10px 14px rgba(0,0,0,.4)); }
#portrait .face.framed { height: clamp(170px, 36vh, 300px); aspect-ratio: 1; }
#portrait .face img.photo, .card .who .f img.photo { object-fit: cover; border-radius: 26px; border: 5px solid #fff; box-shadow: 0 10px 26px rgba(0,0,0,.45); }
.card .who .f img.photo { border-radius: 10px; border-width: 2px; height: 40px; margin-top: 4px; }
#portrait .face svg, #portrait .face img { width: 100%; height: 100%; object-fit: contain; object-position: bottom; display: block; }
.card .who .f { width: 40px; height: 48px; flex: none; }
.card .who .f svg, .card .who .f img { width: 100%; height: 100%; object-fit: contain; }
#portrait .face.hide { visibility: hidden; }
.pop { animation: pop .35s ease; }
@keyframes pop { from { transform: scale(.82) translateY(14px); opacity: .2; } to { transform: none; opacity: 1; } }
.shake { animation: shake .45s; }
@keyframes shake { 0%,100% { transform: none; } 20% { transform: translateX(-9px) rotate(-4deg); } 40% { transform: translateX(8px) rotate(3deg); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }

#dialog {
  position: relative; margin: 0 12px 12px; background: var(--panel); border: 3px solid var(--line);
  border-radius: 16px; padding: 18px 16px 26px; min-height: 118px; box-shadow: 0 8px 24px rgba(0,0,0,.3);
}
#dialog .name { position: absolute; top: -15px; left: 16px; padding: 3px 12px; border-radius: 99px; color: #fff; font-weight: 800; font-size: 14px; }
#dialog .name:empty { display: none; }
#dialog .text { font-size: 17px; line-height: 1.65; white-space: pre-wrap; word-break: keep-all; }
#dialog.narr .text { color: var(--muted); font-style: italic; }
#dialog .next { position: absolute; right: 14px; bottom: 6px; font-size: 12px; color: var(--muted); animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .25; } }

/* 장소 배경 (그림 파일 없이 CSS로) */
.bg-title   { background: radial-gradient(circle at 78% 22%, #ffe3a3 0, transparent 14%), linear-gradient(transparent 58%, #2a2440 58%), linear-gradient(#f39a6b, #6d4f8f 58%); }
.bg-sewer   { background: repeating-linear-gradient(90deg, rgba(255,255,255,.04) 0 3px, transparent 3px 90px), radial-gradient(ellipse at 50% 120%, #4f7a5a 0, transparent 60%), linear-gradient(#22352f, #0f1a17); }
.bg-office  { background: repeating-linear-gradient(0deg, rgba(0,0,0,.08) 0 2px, transparent 2px 46px), radial-gradient(circle at 70% 20%, #f7d488 0, transparent 35%), linear-gradient(#5a4632, #2c2219); }
.bg-port    { background: linear-gradient(transparent 62%, #1f5f8b 62%, #123d5c), radial-gradient(circle at 80% 18%, #ffe9a8 0, transparent 18%), linear-gradient(#8ccbe8, #d7eef7 62%); }
.bg-bank    { background: repeating-linear-gradient(90deg, rgba(255,255,255,.12) 0 18px, transparent 18px 120px), linear-gradient(#a99be0, #5c4f9c); }
.bg-portny  { background: linear-gradient(transparent 60%, #2b4a66 60%, #182c3d), repeating-linear-gradient(90deg, #c0503f 0 60px, #d78a2f 60px 120px, #3f7fbf 120px 180px) 0 52% / 100% 12% no-repeat, linear-gradient(#f4a96b, #ffd9a8 60%); }
.bg-customs { background: repeating-linear-gradient(45deg, rgba(0,0,0,.05) 0 14px, transparent 14px 28px), linear-gradient(#e9dcc2, #b9a37a); }
.bg-storm   { background: radial-gradient(ellipse at 30% 0, #6b7d8c 0, transparent 50%), linear-gradient(#3b4a57, #1c262e); }
.bg-party   { background: radial-gradient(circle at 20% 30%, rgba(255,214,102,.55) 0 6%, transparent 7%), radial-gradient(circle at 75% 25%, rgba(255,128,102,.5) 0 5%, transparent 6%), radial-gradient(circle at 55% 70%, rgba(130,210,160,.45) 0 5%, transparent 6%), linear-gradient(#f08a4b, #8f3b2a); }

/* 겹 창 */
.overlay { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0,0,0,.5); cursor: default; }
.overlay[hidden] { display: none; }
#modal { position: fixed; z-index: 20; }
.card {
  background: var(--panel); color: var(--ink); border-radius: 18px; padding: 20px 18px;
  width: 100%; max-width: 600px; max-height: 100%; overflow: auto; box-shadow: 0 16px 40px rgba(0,0,0,.4);
}
.card h2 { margin: 0 0 6px; font-size: 20px; }
.card h3 { margin: 18px 0 6px; font-size: 16px; }
.card p { line-height: 1.6; margin: 8px 0; }
.card .who { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--muted); font-size: 14px; }
.muted { color: var(--muted); font-size: 13px; }
.opt {
  display: block; width: 100%; text-align: left; margin: 10px 0; padding: 12px 14px;
  border: 2px solid var(--line); border-radius: 12px; background: var(--chip); color: var(--ink);
  font: inherit; cursor: pointer; transition: border-color .15s, transform .1s;
}
.opt:hover, .opt:focus-visible { border-color: var(--accent); outline: none; }
.opt:active { transform: scale(.99); }
.opt b { display: block; font-size: 16px; }
.opt small { display: block; color: var(--muted); margin-top: 3px; font-size: 13px; line-height: 1.45; }
.btn { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 11px 20px; font: inherit; font-weight: 800; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); }
.row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin-top: 14px; }
.lesson { background: var(--lesson); border-radius: 12px; padding: 12px 14px; margin-top: 8px; line-height: 1.6; }
.newcards { margin-top: 12px; display: grid; gap: 8px; }
.tcard { border: 2px dashed var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14px; line-height: 1.5; }
.tcard b { display: block; font-size: 15px; }
.tcard.locked { opacity: .45; }

table.doc { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 8px; }
table.doc th, table.doc td { text-align: left; vertical-align: top; padding: 8px 6px; border-bottom: 1px solid var(--line); line-height: 1.45; }
table.doc th { color: var(--muted); font-weight: 700; white-space: nowrap; }
.paper { background: #fffaf0; color: #2b2622; border: 1px solid #e3d6bf; border-radius: 6px; padding: 12px 14px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13.5px; line-height: 1.6; }
.paper .h { font-weight: 800; text-align: center; letter-spacing: 2px; margin-bottom: 6px; }
.num.plus { color: var(--ok); font-weight: 700; }
.num.minus { color: var(--accent); font-weight: 700; }

/* 서류 대조 미니게임 */
.cmp { display: grid; gap: 8px; margin-top: 10px; }
.cmp .item { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.cmp .lab { font-size: 12px; color: var(--muted); font-weight: 700; }
.cmp .base { font-size: 14px; margin: 2px 0 6px; }
.cmp .base::before { content: "기준 서류 · "; color: var(--muted); font-size: 12px; }
.cmp button {
  width: 100%; text-align: left; font: inherit; font-size: 14px; padding: 7px 9px; border-radius: 8px; cursor: pointer;
  border: 2px solid var(--line); background: #fffaf0; color: #2b2622; font-family: ui-monospace, Menlo, Consolas, monospace;
}
.cmp button::before { content: "송장 · "; color: #9a8c7c; font-family: "Pretendard Variable", system-ui, sans-serif; font-size: 12px; }
.cmp button.found { border-color: var(--ok); background: #e3f6ec; }
.cmp button.found::after { content: "  ✔ 불일치"; color: var(--ok); font-weight: 800; }
.cmp button.nope { border-color: var(--warn); }
.score { font-weight: 800; }

/* 알림 칩 */
#toasts { position: absolute; top: 44px; right: 10px; z-index: 30; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; pointer-events: none; }
.toast { background: var(--panel); color: var(--ink); padding: 6px 12px; border-radius: 99px; font-size: 13px; font-weight: 800; box-shadow: 0 4px 14px rgba(0,0,0,.3); animation: toast 2.8s forwards; }
@keyframes toast { 0% { opacity: 0; transform: translateY(-6px); } 10%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; } }

/* 시작 화면 */
.title h1 { font-size: 26px; margin: 4px 0 2px; }
.title .big { font-size: 80px; text-align: center; line-height: 1.1; }
.grade { font-size: 40px; font-weight: 900; text-align: center; margin: 6px 0; }
ol.flow { padding-left: 20px; line-height: 1.65; }
ol.flow li span { color: var(--muted); font-size: 13px; display: block; }

@media (max-width: 520px) {
  .top { gap: 8px; font-size: 13px; }
  .rage { width: 60px; }
  #dialog .text { font-size: 16px; }
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <span class="logo">🐰 Flushed Trading Co.</span>
    <span class="stat" title="회사 자금">💰 <b id="money">$10,000</b></span>
    <span class="stat" title="스노우볼 분노 게이지 (100이 되면 대폭발)">😡 <span class="rage"><i id="rage"></i></span></span>
    <button id="btnCards" type="button">🃏 <span id="cardCount">0</span></button>
    <button id="btnReset" type="button" title="처음부터 다시">↺</button>
  </header>
  <div class="dots" id="dots"></div>
  <main id="stage" class="bg-sewer">
    <span id="place"></span>
    <div id="portrait"><div class="face hide" id="face"></div></div>
    <div id="dialog">
      <span class="name" id="name"></span>
      <div class="text" id="text"></div>
      <span class="next">눌러서 계속 ▼</span>
    </div>
    <div class="overlay" id="overlay" hidden></div>
    <div id="toasts"></div>
  </main>
</div>
<div class="overlay" id="modal" hidden></div>

<script>
/* ===== 1. 데이터: 등장인물, 용어 카드 ===== */
const WHO = {
  n:      { name: '',                 face: '',   color: '#555' },
  snow:   { name: '스노우볼',          face: '🐰', color: '#e2574c' },
  gid:    { name: '기젯',              face: '🐩', color: '#d94f9b' },
  pops:   { name: '포피 할아버지',      face: '🐕', color: '#8a6a4a' },
  tib:    { name: '타이베리어스',       face: '🦅', color: '#8a5a20' },
  chloe:  { name: '클로이 · 냥냥은행',  face: '🐱', color: '#7b6cc4' },
  norman: { name: '노먼',              face: '🐹', color: '#c08a3e' },
  buddy:  { name: '버디 · 손해보험',    face: '🦮', color: '#3f7fbf' },
  halla:  { name: '한라 · 깡총농장',    face: '🐴', color: '#2f9e6b' },
  rex:    { name: '렉스 · 뉴욕세관',    face: '🐕‍🦺', color: '#44515c' },
  max:    { name: '맥스',              face: '🐶', color: '#3c8dbc' },
};

/* 캐릭터 그림: img/아이디.png(표정은 img/snow_angry.png, img/snow_happy.png)가 있으면 그 그림을,
   없으면 아래 코드로 그린 SVG를 쓴다. */
const O = 'stroke="#2f2d38" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';
const eye = (x, y, r, iris) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" ${O}/><circle cx="${x}" cy="${y + 1}" r="${r * 0.66}" fill="${iris}"/><circle cx="${x}" cy="${y + 1}" r="${r * 0.36}" fill="#17161d"/><circle cx="${x - r * 0.25}" cy="${y - r * 0.25}" r="${r * 0.2}" fill="#fff"/>`;
const bead = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#1d1b22"/><circle cx="${x - r * 0.3}" cy="${y - r * 0.35}" r="${r * 0.32}" fill="#fff"/>`;
const svg = body => `<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;
const ring = (cx, cy, R, r, n, fill, start = 0) => Array.from({ length: n }, (_, i) => {
  const a = start + i * 2 * Math.PI / n;
  return `<circle cx="${(cx + R * Math.cos(a)).toFixed(1)}" cy="${(cy + R * Math.sin(a)).toFixed(1)}" r="${r}" fill="${fill}" ${O}/>`;
}).join('');

const SPRITES = {
  // 스노우볼: 복슬복슬한 흰 토끼, 쫑긋한 귀, 파란 큰 눈, 앞니 두 개
  snow: m => {
    const W = '#fdfdff';
    const eyes = m === 'happy'
      ? `<path d="M64 136 q14 -16 28 0 M108 136 q14 -16 28 0" fill="none" ${O} stroke-width="6"/>`
      : eye(78, 132, 19, '#6fb8ff') + eye(122, 132, 19, '#6fb8ff');
    const brows = m === 'angry'
      ? `<path d="M56 102 L95 117 M144 102 L105 117" fill="none" ${O} stroke-width="8"/>`
      : `<path d="M64 106 q12 -7 24 -2 M112 104 q12 -5 24 2" fill="none" ${O} stroke-width="4"/>`;
    const mouth = m === 'angry'
      ? `<path d="M83 168 q17 -7 34 0 q-3 22 -17 22 q-14 0 -17 -22z" fill="#8a2a3b" ${O}/><path d="M93 167 h14 v10 h-14z M100 167 v10" fill="#fff" ${O} stroke-width="2"/>`
      : `<path d="M100 159 v6 M100 165 q-7 7 -14 1 M100 165 q7 7 14 1" fill="none" ${O}/><path d="M94 168 h12 v10 q0 2 -2 2 h-8 q-2 0 -2 -2z M100 168 v12" fill="#fff" ${O} stroke-width="2"/>`;
    const vein = m === 'angry' ? `<g stroke="#e2344b" stroke-width="5" stroke-linecap="round"><path d="M142 84 l9 -9"/><path d="M147 92 l12 -2"/><path d="M136 78 l2 -12"/></g>` : '';
    return svg(`
      <ellipse cx="100" cy="214" rx="48" ry="26" fill="#f1f2f6" ${O}/>
      <g transform="rotate(-11 76 104)"><ellipse cx="76" cy="58" rx="18" ry="52" fill="${W}" ${O}/><ellipse cx="76" cy="62" rx="8" ry="38" fill="#f7b5c6"/></g>
      <g transform="rotate(11 124 104)"><ellipse cx="124" cy="58" rx="18" ry="52" fill="${W}" ${O}/><ellipse cx="124" cy="62" rx="8" ry="38" fill="#f7b5c6"/></g>
      ${ring(100, 142, 58, 14, 12, W, 0.26)}
      <circle cx="100" cy="142" r="60" fill="${W}" ${O}/>
      <path d="M86 84 q6 10 14 4 q8 6 14 -4" fill="${W}" ${O} stroke-width="2.5"/>
      <ellipse cx="64" cy="160" rx="10" ry="6" fill="#ffc4d2"/><ellipse cx="136" cy="160" rx="10" ry="6" fill="#ffc4d2"/>
      ${brows}${eyes}
      <path d="M92 151 q8 -6 16 0 q-8 9 -16 0z" fill="#f4879f" ${O} stroke-width="2"/>
      ${mouth}${vein}`);
  },
  // 기젯: 흰 포메라니안, 솜사탕 같은 털, 분홍 리본
  gid: () => svg(`
    <ellipse cx="100" cy="214" rx="50" ry="26" fill="#fbf8fb" ${O}/>
    <path d="M58 104 L66 62 L92 92z" fill="#fbf8fb" ${O}/><path d="M142 104 L134 62 L108 92z" fill="#fbf8fb" ${O}/>
    ${ring(100, 140, 56, 17, 13, '#fbf8fb', 0.1)}
    <circle cx="100" cy="140" r="58" fill="#fbf8fb" ${O}/>
    <path d="M128 84 l26 -14 l-2 26z M128 84 l-6 -24 l-20 16z" fill="#ff78b4" ${O}/><circle cx="128" cy="84" r="7" fill="#ff4f9a" ${O}/>
    ${eye(80, 134, 16, '#3b2618')}${eye(120, 134, 16, '#3b2618')}
    <path d="M64 120 l-6 -5 M68 116 l-4 -7 M136 120 l6 -5 M132 116 l4 -7" ${O} stroke-width="2.5"/>
    <ellipse cx="100" cy="154" rx="8" ry="6" fill="#1d1b22"/>
    <path d="M100 160 v4 M100 164 q-6 6 -11 1 M100 164 q6 6 11 1" fill="none" ${O}/>
    <path d="M95 168 q5 10 10 0z" fill="#ff8fb0" ${O} stroke-width="2"/>
    <ellipse cx="68" cy="158" rx="8" ry="5" fill="#ffc9da"/><ellipse cx="132" cy="158" rx="8" ry="5" fill="#ffc9da"/>`),
  // 포피: 늙은 바셋하운드, 축 처진 긴 귀, 처진 눈꺼풀, 흰 눈썹
  pops: () => svg(`
    <ellipse cx="100" cy="216" rx="52" ry="24" fill="#c98b55" ${O}/>
    <rect x="62" y="70" width="76" height="120" rx="38" fill="#c98b55" ${O}/>
    <path d="M70 92 q-34 4 -30 66 q2 32 22 34 q14 0 12 -30z" fill="#6f4123" ${O}/>
    <path d="M130 92 q34 4 30 66 q-2 32 -22 34 q-14 0 -12 -30z" fill="#6f4123" ${O}/>
    <path d="M92 74 q8 -4 16 0 l-2 70 h-12z" fill="#f1e2c8"/>
    <ellipse cx="100" cy="168" rx="34" ry="26" fill="#f1e2c8" ${O}/>
    <circle cx="84" cy="128" r="9" fill="#1d1b22"/><circle cx="116" cy="128" r="9" fill="#1d1b22"/>
    <path d="M72 128 q12 -12 24 0z M104 128 q12 -12 24 0z" fill="#b57a47" ${O} stroke-width="2.5"/>
    <path d="M76 140 q8 5 16 0 M108 140 q8 5 16 0" fill="none" ${O} stroke-width="2"/>
    <path d="M70 112 q8 -8 22 -4 M130 112 q-8 -8 -22 -4" fill="none" stroke="#e9e9ee" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="100" cy="158" rx="13" ry="9" fill="#1d1b22"/>
    <path d="M100 167 v8 M100 175 q-12 10 -22 2 M100 175 q12 10 22 2" fill="none" ${O}/>`),
  // 타이베리어스: 붉은꼬리매, 날카로운 노란 눈, 갈고리 부리
  tib: () => svg(`
    <ellipse cx="100" cy="208" rx="54" ry="34" fill="#f1e5d1" ${O}/>

const IMG = {};
const BG_KEYS = ['title', 'sewer', 'office', 'port', 'bank', 'portny', 'customs', 'storm', 'party'];
function preloadImages() {
  const names = [...Object.keys(SPRITES), 'snow_angry', 'snow_happy', 'snow_shock', ...BG_KEYS.map(k => 'bg_' + k)];
  names.forEach(n => ['png', 'jpg'].forEach(ext => {
    const im = new Image();
    im.onload = () => {
      if (IMG[n] && IMG[n].ext === 'png') return;
      IMG[n] = { src: im.src, ext };
      if (S && S.bgKey && n === 'bg_' + S.bgKey) setBg(S.bgKey);
    };
    im.src = `img/${n}.${ext}`;
  }));
}
function setBg(key) {
  S.bgKey = key;
  const st = $('#stage'), pic = IMG['bg_' + key];
  st.className = 'bg-' + key;
  st.style.backgroundImage = pic ? `linear-gradient(rgba(0,0,0,.08), rgba(0,0,0,.25)), url("${pic.src}")` : '';
}
function sprite(id, mood = 'normal') {
  const k = IMG[`${id}_${mood}`] ? `${id}_${mood}` : id;
  if (IMG[k]) return `<img class="${IMG[k].ext === 'jpg' ? 'photo' : 'cut'}" src="${IMG[k].src}" alt="${WHO[id].name}">`;
  return SPRITES[id] ? SPRITES[id](mood) : '';
}
function moodOf(who, text) {
  if (who !== 'snow') return 'normal';
  if (/…뭐|노오|내… 내|그, 그럼|잠깐|5장에서|보험을 들었는데도|^…$/.test(text)) return 'shock';
  if (/!!|으아|끄아|부들|쳇|…!|크윽/.test(text) || S.rage >= 70) return 'angry';
  if (/최고|이거야|완벽|좋아|아꼈다|파티|통 크게|반값/.test(text)) return 'happy';
  return 'normal';
}

/* ===== 3. 상태와 진행자 ===== */
const SAVE_KEY = 'snowball-trade-v1';
let S;
function fresh() {
  return { ch: 0, money: START_MONEY, rage: 20, cards: [], flags: { price: 1.00, inc: 'FOB', ins: 'none', pay: 'TT100', docMissed: 0, lostKg: 0 }, ledger: [], log: [], queue: [], newCards: [], mode: 'idle', boom: false, lastWho: null };
}
function save() {
  try {
    const { ch, money, rage, cards, flags, ledger, log } = S;
    localStorage.setItem(SAVE_KEY, JSON.stringify({ ch, money, rage, cards, flags, ledger, log }));
  } catch (e) { /* 저장 못 해도 게임은 계속 */ }
}
function load() {
  try { const d = JSON.parse(localStorage.getItem(SAVE_KEY)); return d && typeof d.ch === 'number' ? d : null; }
  catch (e) { return null; }
}
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

function pay(label, amt) {
  S.money += amt;
  S.ledger.push({ label, amt });
  toast(`💰 ${amt > 0 ? '+' : ''}${fmt(amt)}`);
  hud();
}
// 통관 비용: DDP면 농장이 낸다
function cost(label, amt) {
  if (S.flags.inc === 'DDP') { toast('💰 농장 부담 (DDP)'); return; }
  pay(label, amt);
}
function mad(n) {
  S.rage = Math.max(0, Math.min(100, S.rage + n));
  toast(n > 0 ? `😡 분노 +${n}` : `😌 분노 ${n}`);
  if (S.rage >= 100) S.boom = true;
  hud();
}
function card(id) {
  if (S.cards.includes(id)) return;
  S.cards.push(id);
  S.newCards.push(id);
  toast(`🃏 새 카드: ${CARD[id].term}`);
  hud();
}

const CH = () => CHAPTERS[S.ch];
const val = (v) => typeof v === 'function' ? v(S) : v;

function next() {
  if (S.boom) { S.boom = false; S.queue.unshift(...BOOM); }
  const item = S.queue.shift();
  if (item === undefined) return endChapter();
  if (typeof item === 'function') {
    const r = item(S);
    if (r) S.queue.unshift(...(Array.isArray(r) && !(typeof r[0] === 'string' && r.length === 2 && WHO[r[0]]) ? r : [r]));
    return next();
  }
  if (Array.isArray(item)) return showLine(item[0], val(item[1]));
  switch (item.t) {
    case 'do': item.fn(S); return next();
    case 'doc': return showDoc(item);
    case 'choice': return showChoice(item);
    case 'lesson': return showLesson(item.text);
    case 'game': return showGame();
    case 'final': return showFinal();
  }
}

function choose(step, opt) {
  S.log.push({ ch: S.ch, q: step.prompt, a: opt.label });
  opt.run && opt.run(S);
  const items = [...(opt.res || [])];
  if (S.boom) { S.boom = false; items.push(...BOOM); }
  if (opt.lesson) items.push({ t: 'lesson', text: opt.lesson });
  if (opt.retry) items.push({ ...step, options: step.options.filter(o => o !== opt) });
  S.queue.unshift(...items);
  closeOverlay();
  next();
}

function startChapter(i) {
  S.ch = i;
  S.queue = [];
  S.newCards = [];
  S.lastWho = null;
  S.lastMood = null;
  save();
  hud();
  const ch = CH();
  setBg(val(ch.bg));
  $('#place').textContent = '📍 ' + val(ch.place);
  showLine('n', '');
  openOverlay(`
    <div class="card" style="text-align:center">
      <p class="muted">${i + 1} / ${CHAPTERS.length}</p>
      <h2>${ch.title}</h2>
      <p class="muted">📍 ${val(ch.place)}</p>
      <div class="row" style="justify-content:center"><button class="btn" id="go">시작 ▶</button></div>
    </div>`);
  $('#go').onclick = () => { closeOverlay(); S.queue = [...ch.steps]; next(); };
}

function endChapter() {
  if (S.ch >= CHAPTERS.length - 1) return;
  const got = S.cards.length;
  openOverlay(`
    <div class="card" style="text-align:center">
      <h2>🎉 ${CH().title} 클리어!</h2>
      <p>💰 자금 <b>${fmt(S.money)}</b> · 😡 분노 <b>${S.rage}</b> · 🃏 카드 <b>${got}/${CARDS.length}</b></p>
      <p class="muted">진행 상황이 저장됐어요.</p>
      <div class="row" style="justify-content:center"><button class="btn" id="go">다음 장으로 ▶</button></div>
    </div>`);
  $('#go').onclick = () => { closeOverlay(); startChapter(S.ch + 1); };
}

/* ===== 4. 화면 ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function hud() {
  $('#money').textContent = fmt(S.money);
  $('#rage').style.width = S.rage + '%';
  $('#cardCount').textContent = S.cards.length;
  $('#dots').innerHTML = CHAPTERS.map((c, i) => `<span class="${i < S.ch ? 'done' : i === S.ch ? 'now' : ''}" title="${esc(c.title)}"></span>`).join('');
}

function showLine(who, text) {
  S.mode = 'line';
  const w = WHO[who] || WHO.n;
  const face = $('#face'), dlg = $('#dialog');
  if (who === 'n') face.classList.add('hide');
  else {
    face.classList.remove('hide');
    const mood = moodOf(who, text);
    if (S.lastWho !== who || S.lastMood !== mood) {
      face.innerHTML = sprite(who, mood);
      face.classList.toggle('framed', !!face.querySelector('img.photo'));
      S.lastMood = mood;
      face.classList.remove('pop'); void face.offsetWidth; face.classList.add('pop');
    }
    if (who === 'snow' && (S.rage >= 70 || /!!|으아|끄아/.test(text))) { face.classList.remove('shake'); void face.offsetWidth; face.classList.add('shake'); }
  }
  S.lastWho = who;
  dlg.classList.toggle('narr', who === 'n');
  $('#name').textContent = w.name;
  $('#name').style.background = w.color;
  $('#text').textContent = text;
}

function openOverlay(html) { S.mode = 'overlay'; const o = $('#overlay'); o.innerHTML = html; o.hidden = false; const b = o.querySelector('button'); b && b.focus({ preventScroll: true }); }
function closeOverlay() { $('#overlay').hidden = true; $('#overlay').innerHTML = ''; S.mode = 'line'; }

function showDoc(item) {
  openOverlay(`<div class="card"><h2>${item.title}</h2>${val(item.html)}
    <div class="row"><button class="btn" id="ok">확인 ▶</button></div></div>`);
  $('#ok').onclick = () => { closeOverlay(); next(); };
}

function showChoice(step) {
  const lastSpeaker = S.lastWho && S.lastWho !== 'n' ? WHO[S.lastWho] : null;
  openOverlay(`<div class="card">
    ${lastSpeaker ? `<div class="who"><span class="f">${sprite(S.lastWho)}</span>${lastSpeaker.name}</div>` : ''}
    <h2>${step.prompt}</h2>
    ${step.options.map((o, i) => `<button class="opt" data-i="${i}"><b>${o.label}</b>${o.sub ? `<small>${o.sub}</small>` : ''}</button>`).join('')}
  </div>`);
  $('#overlay').querySelectorAll('.opt').forEach(b => b.onclick = () => choose(step, step.options[+b.dataset.i]));
}

function cardHtml(id) { return `<div class="tcard"><b>🃏 ${CARD[id].term}</b>${CARD[id].desc}</div>`; }

function showLesson(text) {
  const nc = S.newCards.splice(0);
  openOverlay(`<div class="card">
    <div class="who"><span class="f">${sprite('pops')}</span>포피 할아버지의 한 줄</div>
    <div class="lesson">${text}</div>
    ${nc.length ? `<h3>새로 얻은 카드</h3><div class="newcards">${nc.map(cardHtml).join('')}</div>` : ''}
    <div class="row"><button class="btn" id="ok">계속 ▶</button></div></div>`);
  $('#ok').onclick = () => { closeOverlay(); next(); };
}

function showGame() {
  const lc = S.flags.pay === 'LC';
  const price = `USD ${unit(S).toFixed(2)}/kg, ${INC_LABEL[S.flags.inc]}`;
  const rows = [
    ['판매자', 'Halla Kkangchong Farm, Jeju, Korea', null],
    ['구매자 (수하인)', 'Flushed Trading Co., New York', 'Flush Trading Co., New York'],
    ['품명', 'Fresh Jeju Carrots', null],
    ['수량', '5,000 kg', '4,500 kg'],
    ['단가', price, null],
    ['도착항', 'New York, USA', 'Los Angeles, USA'],
  ];
  const total = rows.filter(r => r[2]).length;
  let found = 0;
  openOverlay(`<div class="card">
    <h2>🔍 ${lc ? '클로이의 서류 심사 · 신용장 vs 상업송장' : '기젯의 서류 대조 · 계약서 vs 상업송장'}</h2>
    <p>상업송장에서 ${lc ? '신용장' : '계약서'}과 <b>다른 칸</b>을 눌러 찾아라! 틀린 칸은 <b>${total}개</b>. 맞는 칸을 누르면 스노우볼이 화낸다.</p>
    <div class="cmp">${rows.map((r, i) => `<div class="item"><div class="lab">${r[0]}</div><div class="base">${esc(r[1])}</div><button data-i="${i}">${esc(r[2] || r[1])}</button></div>`).join('')}</div>
    <p class="score" id="score">찾은 곳: 0 / ${total}</p>
    <div class="row"><button class="btn" id="done">심사 끝내기 ▶</button></div></div>`);
  $('#overlay').querySelectorAll('.cmp button').forEach(b => b.onclick = () => {
    const r = rows[+b.dataset.i];
    if (b.classList.contains('found')) return;
    if (r[2]) {
      b.classList.add('found'); found++;
      toast('🔍 찾았다!');
      $('#score').textContent = `찾은 곳: ${found} / ${total}` + (found === total ? ' · 완벽해요!' : '');
    } else {
      b.classList.remove('nope'); void b.offsetWidth; b.classList.add('nope', 'shake');
      toast('🐰 “그건 맞잖아!”');
      mad(5);
    }
  });
  $('#done').onclick = () => {
    S.flags.docMissed = total - found;
    card('ci');
    if (lc) card('discrepancy');
    closeOverlay();
    next();
  };
}

function showFinal() {
  const profit = S.money - START_MONEY;
  const [g, gname] = profit >= 5000 ? ['S', '전설의 무역왕'] : profit >= 3500 ? ['A', '믿음직한 대표'] : profit >= 2000 ? ['B', '성장하는 무역상'] : ['C', '수업료를 많이 낸 대표'];
  const pick = ch => S.log.filter(l => l.ch === ch).map(l => l.a.replace(/^[^\p{L}\p{N}$]+/u, '')).join(' → ') || '-';
  const flow = [
    ['문의·거래처 고르기', 0], ['오퍼와 승낙 (계약 성립)', 1], ['인코텀즈·적하보험', 2], ['결제 조건 (T/T·L/C)', 3],
    ['선적서류 대조', 4], ['B/L로 화물 찾기', 5], ['수입통관 (HS·검역·FTA)', 6], ['사고와 보험 클레임', 7],
  ];
  const docNote = S.flags.docMissed ? `틀린 곳 ${S.flags.docMissed}개 놓침` : '틀린 곳 모두 찾음';
  S.mode = 'overlay';
  clearSave();
  openOverlay(`<div class="card">
    <h2>🥕 거래 완료! 최종 정산</h2>
    <div class="grade">${g}</div>
    <p style="text-align:center"><b>${gname}</b><br><span class="muted">순이익 ${fmt(profit)} · 남은 분노 ${S.rage} · 카드 ${S.cards.length}/${CARDS.length}</span></p>

    <h3>📒 장부</h3>
    <table class="doc">
      <tr><td>시작 자금</td><td class="num">${fmt(START_MONEY)}</td></tr>
      ${S.ledger.map(l => `<tr><td>${esc(l.label)}</td><td class="num ${l.amt >= 0 ? 'plus' : 'minus'}">${l.amt > 0 ? '+' : ''}${fmt(l.amt)}</td></tr>`).join('')}
      <tr><th>최종 자금</th><th class="num">${fmt(S.money)}</th></tr>
    </table>

    <h3>🐕 포피 할아버지의 무역 흐름 한 장 정리</h3>
    <ol class="flow">${flow.map(([t, ch]) => `<li>${t}<span>내 선택: ${esc(ch === 4 ? docNote : pick(ch))}</span></li>`).join('')}
      <li>판매와 정산<span>당근 ${(QTY - S.flags.lostKg).toLocaleString('en-US')}kg 판매</span></li></ol>
    <p class="muted">다른 선택을 하면 비용과 사건이 달라져요. 다시 해서 S등급과 카드 ${CARDS.length}장을 모아보세요!</p>
    <p class="muted">※ 개인 학습용 팬 게임입니다. 캐릭터 ‘마이펫의 이중생활’의 저작권은 Illumination·Universal에 있습니다. 금액·세율·운임은 게임용 가상 수치로, 실제 거래 조건과 다릅니다.</p>
    <div class="row"><button class="btn ghost" id="dex">🃏 카드 도감</button><button class="btn" id="again">처음부터 다시 ↺</button></div>
  </div>`);
  $('#dex').onclick = showDex;
  $('#again').onclick = () => { S = fresh(); hud(); startChapter(0); };
}

function showDex() {
  const m = $('#modal');
  m.innerHTML = `<div class="card"><h2>🃏 무역 용어 카드 도감 (${S.cards.length}/${CARDS.length})</h2>
    <div class="newcards">${CARDS.map(([id]) => S.cards.includes(id) ? cardHtml(id) : `<div class="tcard locked"><b>🔒 ???</b>아직 못 얻은 카드</div>`).join('')}</div>
    <div class="row"><button class="btn" id="closeDex">닫기</button></div></div>`;
  m.hidden = false;
  $('#closeDex').onclick = () => { m.hidden = true; m.innerHTML = ''; };
}

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  const box = $('#toasts');
  box.appendChild(t);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => t.remove(), 2900);
}

function showTitle() {
  const saved = load();
  S = fresh();
  hud();
  setBg('title');
  $('#place').textContent = '📍 뉴욕 지하';
  showLine('n', '');
  openOverlay(`<div class="card title">
    <div class="big">🐰🥕</div>
    <h1>캡틴 스노우볼의 무역회사</h1>
    <p>버려진 동물들의 당근 창고가 텅 비었다! 스노우볼과 함께 제주 당근 5톤을 뉴욕 하수구까지 들여와 보자.</p>
    <p class="muted">문의 → 오퍼 → 인코텀즈 → 결제 → 서류 → B/L → 통관 → 보험까지, 9장짜리 수입 한 건. 고르기만 하면 진행돼요. 한 판에 15분쯤 걸려요.</p>
    <p class="muted">💰 자금을 지키고 😡 분노 게이지를 조심하세요. 100이 되면 스노우볼이 대폭발해요!</p>
    <div class="row">
      ${saved && saved.ch > 0 ? `<button class="btn ghost" id="cont">이어하기 (${saved.ch + 1}장)</button>` : ''}
      <button class="btn" id="start">새로 시작 ▶</button>
    </div>
    <p class="muted" style="margin-top:14px">개인 학습용 팬 게임 · 캐릭터 저작권 Illumination·Universal · 금액은 가상 수치</p>

  $('#start').onclick = () => { clearSave(); S = fresh(); startChapter(0); };

  if (c) c.onclick = () => { Object.assign(S, saved); startChapter(saved.ch); };
}

$('#stage').addEventListener('click', e => { if (S.mode === 'line' && !e.target.closest('.overlay')) next(); });
document.addEventListener('keydown', e => {
  if ((e.key === ' ' || e.key === 'Enter') && S.mode === 'line' && $('#modal').hidden) { e.preventDefault(); next(); }
});
$('#btnCards').onclick = showDex;
$('#btnReset').onclick = () => { if (confirm('처음부터 다시 할까요? 저장된 진행 상황이 지워져요.')) { clearSave(); showTitle(); } };

preloadImages();
showTitle();
</script>
